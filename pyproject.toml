[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oxipy"
version = "0.2.4"
description = "Python client for Oxidized API with TTP-based config parsing"
readme = "README.md"
authors = [
    { name = "Ilya Shramko", email = "starksc2@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "oxidized",
    "network",
    "networking",
    "configuration",
    "backup",
    "ttp",
    "parsing",
]
dependencies = [
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "ttp>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
    "ruff>=0.15.17",
]

[project.urls]
Homepage = "https://github.com/sttarsky/oxipy"
Repository = "https://github.com/sttarsky/oxipy"
Documentation = "https://github.com/sttarsky/oxipy#readme"
Issues = "https://github.com/sttarsky/oxipy/issues"
Changelog = "https://github.com/sttarsky/oxipy/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["oxi*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"oxi" = ["py.typed", "**/*.ttp"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
